<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans pb-24">

    <!-- Header -->
    <div class="bg-blue-600 text-white p-6 text-center shadow-lg">
        <h1 class="text-2xl font-bold">Tasks</h1>
    </div>

    <!-- Progress Section -->
    <div class="max-w-md mx-auto p-4">
        <div class="bg-white rounded-2xl p-6 shadow-sm flex justify-around items-center mb-6">
            <div class="text-center">
                <p class="text-2xl font-bold text-gray-800">0</p>
                <p class="text-xs text-gray-500">Unfinished</p>
            </div>
            <div class="relative">
                <div class="w-24 h-24 rounded-full border-4 border-blue-500 flex items-center justify-center font-bold text-blue-600">100%</div>
                <p class="text-center text-xs mt-1">Progress</p>
            </div>
            <div class="text-center">
                <p class="text-2xl font-bold text-gray-800">2</p>
                <p class="text-xs text-gray-500">Completed</p>
            </div>
        </div>

        <!-- Today Profit Section -->
        <div class="bg-white rounded-2xl p-4 mb-6 shadow-sm flex justify-between">
            <div>
                <p class="text-xs text-gray-500">Today profit</p>
                <p class="font-bold text-blue-600">ETB 200.00</p>
            </div>
            <div>
                <p class="text-xs text-gray-500">Available balance</p>
                <p class="font-bold text-gray-800">ETB 0.00</p>
            </div>
        </div>

        <!-- Start Task Button -->
        <button class="w-full bg-blue-600 text-white py-4 rounded-2xl font-bold text-lg shadow-lg mb-6">Start task</button>

        <!-- App Icons Grid -->
        <div class="grid grid-cols-4 gap-4">
            <!-- Example Icons -->
            <div class="bg-white p-4 rounded-xl shadow-sm text-center"><i class="fa-brands fa-tiktok text-2xl text-black"></i></div>
            <div class="bg-white p-4 rounded-xl shadow-sm text-center"><i class="fa-brands fa-facebook text-2xl text-blue-600"></i></div>
            <div class="bg-white p-4 rounded-xl shadow-sm text-center"><i class="fa-brands fa-instagram text-2xl text-pink-500"></i></div>
            <div class="bg-white p-4 rounded-xl shadow-sm text-center"><i class="fa-brands fa-youtube text-2xl text-red-600"></i></div>
        </div>
    </div>

    <!-- Bottom Navigation Bar (ይህንን ከ index.html መገልበጥ ይችላሉ) -->
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 py-2 px-6 flex justify-between items-center text-center shadow-lg">
        <a href="index.html" class="text-gray-400 flex flex-col items-center">
            <i class="fa-solid fa-house text-lg"></i>
            <span class="text-xs font-medium mt-1">Home</span>
        </a>
        <a href="tasks.html" class="text-blue-600 flex flex-col items-center">
            <i class="fa-solid fa-list-check text-lg"></i>
            <span class="text-xs font-medium mt-1">Tasks</span>
        </a>
        <a href="#" class="text-gray-400 flex flex-col items-center">
            <i class="fa-solid fa-sack-dollar text-lg"></i>
            <span class="text-xs font-medium mt-1">Wealth</span>
        </a>
        <a href="#" class="text-gray-400 flex flex-col items-center">
            <i class="fa-solid fa-users text-lg"></i>
            <span class="text-xs font-medium mt-1">Team</span>
        </a>
        <a href="#" class="text-gray-400 flex flex-col items-center">
            <i class="fa-solid fa-user text-lg"></i>
            <span class="text-xs font-medium mt-1">Me</span>
        </a>
    </div>
</body>
</html>
