<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chal VIP - Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans pb-24">

    <!-- Header Banner -->
    <div class="bg-blue-600 text-white p-6 text-center rounded-b-3xl shadow-lg">
        <h1 class="text-3xl font-bold tracking-wide">CHAL VIP</h1>
        <p class="text-sm mt-1 opacity-90">Check-In Hub & Task Center</p>
    </div>

    <!-- Membership Levels Section -->
    <div class="max-w-md mx-auto p-4">
        <h2 class="text-xl font-bold text-gray-800 mb-4 flex items-center gap-2">
            <i class="fa-solid fa-crown text-yellow-500"></i> Membership Levels
        </h2>

        <!-- VIP 1 Card -->
        <div class="bg-white rounded-2xl p-4 mb-4 shadow-sm border border-blue-100 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <span class="bg-blue-600 text-white font-bold px-3 py-1.5 rounded-xl text-sm">VIP1</span>
                <div>
                    <p class="text-xs text-gray-500">Daily Tasks: <span class="font-semibold text-gray-800">2</span></p>
                    <p class="text-xs text-gray-500">Recharge Amount: <span class="font-semibold text-blue-600">ETB 1,000.00</span></p>
                </div>
            </div>
            <button class="bg-blue-600 text-white text-xs px-4 py-2 rounded-xl font-bold shadow-md">Activated</button>
        </div>

        <!-- VIP 2 Card -->
        <div class="bg-white rounded-2xl p-4 mb-4 shadow-sm border border-gray-100 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <span class="bg-blue-400 text-white font-bold px-3 py-1.5 rounded-xl text-sm">VIP2</span>
                <div>
                    <p class="text-xs text-gray-500">Daily Tasks: <span class="font-semibold text-gray-800">2</span></p>
                    <p class="text-xs text-gray-500">Recharge Amount: <span class="font-semibold text-blue-600">ETB 8,000.00</span></p>
                </div>
            </div>
            <button class="bg-blue-500 text-white text-xs px-4 py-2 rounded-xl font-bold">Join now</button>
        </div>

        <!-- VIP 3 Card -->
        <div class="bg-white rounded-2xl p-4 mb-4 shadow-sm border border-gray-100 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <span class="bg-blue-400 text-white font-bold px-3 py-1.5 rounded-xl text-sm">VIP3</span>
                <div>
                    <p class="text-xs text-gray-500">Daily Tasks: <span class="font-semibold text-gray-800">2</span></p>
                    <p class="text-xs text-gray-500">Recharge Amount: <span class="font-semibold text-blue-600">ETB 16,000.00</span></p>
                </div>
            </div>
            <button class="bg-blue-500 text-white text-xs px-4 py-2 rounded-xl font-bold">Join now</button>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 py-2 px-6 flex justify-between items-center text-center shadow-lg">
        <a href="#" class="text-blue-600 flex flex-col items-center">
            <i class="fa-solid fa-house text-lg"></i>
            <span class="text-xs font-medium mt-1">Home</span>
        </a>
        <a href="#" class="text-gray-400 flex flex-col items-center">
            <i class="fa-solid fa-list-check text-lg"></i>
            <span class="text-xs font-medium mt-1">Tasks</span>
        </a>
        <a href="#" class="text-gray-400 flex flex-col items-center">
            <i class="fa-solid fa-sack-dollar text-lg"></i>
            <span class="text-xs font-medium mt-1">Wealth</span>
        </a>
        <a href="#" class="text-gray-400 flex flex-col items-center">
            <i class="fa-solid fa-users text-lg"></i>
            <span class="text-xs font-medium mt-1">Team</span>
        </a>
        <a href="#" class="text-gray-400 flex flex-col items-center">
            <i class="fa-solid fa-user text-lg"></i>
            <span class="text-xs font-medium mt-1">Me</span>
        </a>
    </div>

</body>
</html>
