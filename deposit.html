<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deposit / Recharge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans pb-10">

    <!-- Header -->
    <div class="bg-blue-600 text-white p-4 shadow-lg flex items-center gap-3">
        <a href="me.html" class="text-white text-lg"><i class="fa-solid fa-arrow-left"></i></a>
        <h1 class="text-lg font-bold">Recharge / Deposit</h1>
    </div>

    <div class="max-w-md mx-auto p-4">
        
        <!-- Payment Methods / Bank Details -->
        <div class="bg-white rounded-2xl p-5 shadow-sm mb-6 border border-blue-100">
            <h2 class="font-bold text-gray-800 mb-3 text-sm flex items-center gap-2">
                <i class="fa-solid fa-building-columns text-blue-600"></i> የክፍያ መረጃ (Bank Details)
            </h2>
            <p class="text-xs text-gray-500 mb-4">እባክዎን ከታች ባሉት የባንክ ሂሳቦች ክፍያውን ይፈጽሙ፡</p>

            <!-- Commercial Bank of Ethiopia (CBE) -->
            <div class="bg-blue-50 p-4 rounded-xl mb-3 border border-blue-200">
                <div class="flex justify-between items-center mb-1">
                    <span class="font-bold text-blue-900 text-sm">CBE (የኢትዮጵያ ንግድ ባንክ)</span>
                </div>
                <p class="text-xs text-gray-600">Account Name: <span class="font-semibold text-gray-800">የእርስዎ ስም (Chalachew Haymanot)</span></p>
                <p class="text-sm font-extrabold text-blue-700 tracking-wider mt-1">1000092937449</p>
            </div>

            <!-- Telebirr -->
            <div class="bg-purple-50 p-4 rounded-xl border border-purple-200">
                <div class="flex justify-between items-center mb-1">
                    <span class="font-bold text-purple-900 text-sm">Telebirr (ቴሌብር)</span>
                </div>
                <p class="text-xs text-gray-600">Account Name: <span class="font-semibold text-gray-800">የእርስዎ ስም (Chalachew)</span></p>
                <p class="text-sm font-extrabold text-purple-700 tracking-wider mt-1">+251924099009</p>
            </div>
        </div>

        <!-- Submission Form -->
        <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100">
            <h3 class="font-bold text-gray-800 mb-4 text-sm">የክፍያ ማረጋገጫ ማስገቢያ</h3>

            <form>
                <!-- Amount -->
                <div class="mb-4">
                    <label class="block text-xs font-semibold text-gray-600 mb-1">የክፍያው መጠን (ETB)</label>
                    <input type="number" placeholder="1000" class="w-full p-3 rounded-xl border border-gray-200 text-sm focus:outline-blue-500">
                </div>

                <!-- Transaction ID -->
                <div class="mb-4">
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Transaction ID / የደረሰኝ ቁጥር</label>
                    <input type="text" placeholder="እ.ኤ.አ FT24XXXXXX" class="w-full p-3 rounded-xl border border-gray-200 text-sm focus:outline-blue-500">
                </div>

                <!-- Receipt Upload -->
                <div class="mb-6">
                    <label class="block text-xs font-semibold text-gray-600 mb-1">የደረሰኝ ፎቶ (Screenshot)</label>
                    <input type="file" class="w-full text-xs text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                </div>

                <!-- Submit Button -->
                <button type="button" class="w-full bg-blue-600 text-white py-3.5 rounded-xl font-bold text-sm shadow-md">Submit Payment</button>
            </form>
        </div>

    </div>

</body>
</html>
